<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f7f9" />
  <meta name="description" content="Secure access to Encore Transport." />
  <title>Encore Transport | Sign in</title>
  <link rel="stylesheet" href="../../packages/shared/styles.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="authTitle">
      <a class="auth-brand" href="/website/" aria-label="Encore Transport home">
        <img src="/logo.svg" alt="Encore Transport" />
      </a>
      <div class="auth-copy">
        <span class="eyebrow">Secure access</span>
        <h1 id="authTitle">Sign in to continue.</h1>
        <p>Use the account assigned to you. Encore will direct you to the area permitted by your role.</p>
      </div>
      <div id="authMessage" class="auth-message" aria-live="polite" hidden></div>
      <form id="loginForm" class="auth-form">
        <label><span>Email</span><input name="email" type="email" autocomplete="username" required /></label>
        <label><span>Password</span><input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="button button--primary button--block" type="submit">Sign in</button>
      </form>
      <div class="auth-footer"><a href="/website/">← Back to website</a></div>
    </section>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
