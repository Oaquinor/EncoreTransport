<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071722" />
  <meta name="application-name" content="Encore Transport" />
  <meta name="description" content="Encore Transport account sign in." />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <title>Staff Sign In | Encore Transport</title>
  <meta name="google-client-id" content="1094552615273-asqmom1d3tq9t382umtjpng7g7pd8h67.apps.googleusercontent.com" />

  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <main class="premium-auth-shell">
    <section class="premium-auth-visual" aria-hidden="true">
      <div class="premium-auth-visual__shade"></div>
      <img src="/assets/media/Autobus.png" alt="" />
      <div class="premium-auth-visual__copy">
        <span>Encore Transport</span>
        <strong>Welcome back to the Encore team.</strong>
      </div>
    </section>

    <section class="premium-auth-panel" aria-labelledby="authTitle">
      <a class="et-brand-lockup premium-auth-brand" href="/website/" aria-label="Encore Transport home">
        <img class="et-brand-lockup__logo" src="/logo.svg" alt="" aria-hidden="true" />
        <span class="et-brand-lockup__copy">
          <strong>encore</strong>
          <small>transport</small>
        </span>
      </a>

      <div class="premium-auth-copy">
        <span class="et-kicker">Account sign in</span>
        <h1 id="authTitle">Welcome back.</h1>
        <p>Sign in with your Encore account to continue to your passenger or operations workspace.</p>
      </div>

      <div id="authMessage" class="auth-message" aria-live="polite" hidden></div>

      <form id="loginForm" class="premium-auth-form">
        <label>
          <span>Email</span>
          <input name="email" type="email" autocomplete="username" required placeholder="you@example.com" />
        </label>

        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </label>

        <button class="premium-auth-submit" type="submit">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"/></svg> Sign in
        </button>
      </form>
      <div class="social-divider"><span>or continue as a passenger</span></div>
      <div id="googleSignIn" class="google-sign-in" aria-label="Continue with Google"></div>

      <div class="premium-auth-footer">
        <a href="/website/"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg> Back to website</a>
        <span>Need help signing in? Contact your Encore administrator.</span>
      </div>
    </section>
  </main>

  <script type="module" src="./app.mjs"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
