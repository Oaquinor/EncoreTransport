    <style>.number{font:800 10px Arial,sans-serif;fill:#24465a;text-anchor:middle;dominant-baseline:middle}.label{font:800 10px Arial,sans-serif;fill:#4d6d7d;letter-spacing:.12em}.small{font:800 8px Arial,sans-serif;fill:#678391;letter-spacing:.08em}</style>
  </defs>
