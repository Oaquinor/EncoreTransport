<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">Encore Transport 55-seat coach layout</title>
  <desc id="desc">Vector bus layout with driver area, front door, central aisle and numbered seats one through fifty-five.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#4e819f"/><stop offset=".15" stop-color="#c8e0ea"/><stop offset=".82" stop-color="#edf6f9"/><stop offset="1" stop-color="#c4dbe5"/></linearGradient>
