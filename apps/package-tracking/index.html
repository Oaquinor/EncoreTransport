<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071722">
  <meta
    name="description"
    content="Track an Encore Transport package online with the tracking number provided for your shipment.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="/track-package/">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <meta property="og:title" content="Track a Package | Encore Transport">
  <meta
    property="og:description"
    content="Enter your Encore Transport tracking number to see the latest recorded update for your package.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/track-package/">
  <meta property="og:site_name" content="Encore Transport">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Track a Package | Encore Transport">
  <meta name="twitter:description" content="Enter your tracking number to see the latest recorded update for your Encore Transport package.">
  <title>Track a Package | Encore Transport</title>

  <link rel="stylesheet" href="../../packages/shared/styles.css">
  <link rel="stylesheet" href="../../packages/shared/premium.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./premium.css">
</head>
<body>
  <main class="premium-tracking-shell">
    <section class="premium-tracking-intro">
      <a href="/website/" class="et-brand-lockup premium-tracking-brand" aria-label="Encore Transport home">
        <img class="et-brand-lockup__logo" src="/logo.svg" alt="" aria-hidden="true">
        <span class="et-brand-lockup__copy">
          <strong>encore</strong>
          <small>transport</small>
        </span>
      </a>

      <div>
        <span class="premium-tracking-kicker">Package tracking</span>
        <h1>Track your package.</h1>
        <p>Enter the tracking number provided for your shipment to see its latest recorded status.</p>
      </div>
    </section>

    <section class="premium-tracking-panel" aria-label="Track a package">
      <form id="trackForm" class="premium-tracking-form">
        <label>
          <span>Tracking number</span>
          <input
            name="token"
            autocomplete="off"
            required
            inputmode="text"
            aria-describedby="trackingHelp"
            placeholder="Enter your tracking number">
        </label>

        <small id="trackingHelp">Use the number shown on your package receipt or confirmation.</small>

        <button type="submit">Track package <span>→</span></button>
      </form>

      <div id="result" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
